[project]
name = "research-rlm"
version = "0.1.0"
description = "A minimal, from-scratch Recursive Language Model (RLM) engine."
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=7"]
tui = ["textual>=0.60"]        # the rrl-tui observability dashboard

[project.scripts]
rrl-engine = "rlm.cli:main"
rrl-explain = "paper.cli:main"     # fetch + explain an arXiv paper
rrl-tui = "tui.app:main"           # live Textual dashboard (needs the `tui` extra)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rlm", "paper", "tui"]
